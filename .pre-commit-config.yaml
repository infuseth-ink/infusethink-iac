---
# Pre-commit hooks for code quality and consistency
# See https://pre-commit.com for more information

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: [--multi]
      - id: check-toml
        name: Check TOML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=1000]

  # Local hooks (tools managed by mise + uv tool)
  - repo: local
    hooks:
      # HCL formatting
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -diff -recursive
        language: system
        files: \.tf$
        pass_filenames: false

      # HCL linting
      - id: tflint
        name: tflint
        entry: tflint --recursive --minimum-failure-severity=error
        language: system
        files: \.tf$
        pass_filenames: false

      # Markdown + TOML + JSON formatting
      - id: dprint
        name: dprint fmt
        entry: uv run dprint fmt
        language: system
        files: \.(md|toml)$
        pass_filenames: false

  # Commit message validation (gitmoji conventional commits)
  - repo: https://github.com/ljnsn/cz-conventional-gitmoji
    rev: v0.7.0
    hooks:
      - id: conventional-gitmoji

# pre-commit.ci config (no-op for local-only hooks but harmless)
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [terraform-fmt, tflint, dprint]
  submodules: false

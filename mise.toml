[tools]
uv = "latest"
terraform = "1.14.9"
tflint = "latest"

[tasks.setup]
description = "One-time: install dev tools and git hooks"
run = [
  "uv sync --group dev",
  "uv run pre-commit install",
]

[tasks.tf]
description = "Run terraform in an environment with AWS creds exported. Usage: mise run tf <env> <terraform args>"
usage = '''
arg "env" help="Environment name: staging, dev, or prod"
arg "args" var=#true help="Arguments passed to terraform"
'''
run = '''
eval "$(aws configure export-credentials --format env)"
# Fetch the pg backend connection string from Secrets Manager. On a fresh
# bootstrap (before the secret exists) this is empty; comment out the
# backend block in environments/shared/backend.tf and apply locally first.
# See README → "Bootstrap / disaster recovery".
export PG_CONN_STR="$(aws secretsmanager get-secret-value \
  --secret-id infusethink/terraform-state-conn-str \
  --query SecretString --output text 2>/dev/null || true)"
cd "environments/$usage_env"
terraform $usage_args
'''

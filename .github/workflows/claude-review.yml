name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}
            Please review this pull request. This is a Terraform IaC repository managing AWS infrastructure. Focus on:
            - Correctness: misconfigured resources, wrong attribute values, missing required arguments
            - Security: overly permissive IAM policies, public-facing resources that should be private, exposed secrets or hardcoded credentials
            - AWS best practices: proper tagging, encryption at rest/in transit, least-privilege IAM, sensible defaults
            - Terraform hygiene: missing lifecycle rules, hardcoded values that should be variables, outputs that should be exposed, improper use of `depends_on`
            - State safety: changes that could cause unintended resource replacement or destruction (force-new)
            - Cost: resources that could be unexpectedly expensive or missing cost controls
            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --model claude-sonnet-4-6
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

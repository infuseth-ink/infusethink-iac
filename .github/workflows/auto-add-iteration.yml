name: Auto Add to Sprint

on:
  issues:
    types: [opened]

jobs:
  auto-add-iteration:
    name: Add to current sprint
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }}
      PROJECT_ID: PVT_kwDODgUoq84BO8rz
    steps:
      - name: Assign current sprint
        run: |
          # Fetch Sprint field ID and current iteration ID
          result=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2IterationField {
                        id name
                        configuration { iterations { id title } }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID")

          FIELD_ID=$(echo "$result" | jq -r '.data.node.fields.nodes[] | select(.name=="Sprint") | .id')
          ITERATION_ID=$(echo "$result" | jq -r '.data.node.fields.nodes[] | select(.name=="Sprint") | .configuration.iterations[0].id')
          ITERATION_TITLE=$(echo "$result" | jq -r '.data.node.fields.nodes[] | select(.name=="Sprint") | .configuration.iterations[0].title')
          echo "Current sprint: $ITERATION_TITLE"

          # Add issue to project
          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                item { id }
              }
            }' -f projectId="$PROJECT_ID" -f contentId="${{ github.event.issue.node_id }}" \
            --jq '.data.addProjectV2ItemById.item.id')
          echo "Item ID: $ITEM_ID"

          # Set sprint
          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId, fieldId: $fieldId
                value: { iterationId: $iterationId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f iterationId="$ITERATION_ID"

          echo "Done — assigned to $ITERATION_TITLE"

name: Terraform Lint & Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ hashFiles('mise.toml', 'environments/**/versions.tf') }}
          restore-keys: |
            tf-providers-

      - name: Create provider cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: terraform fmt
        run: terraform fmt -check -diff -recursive

      - name: tflint
        run: tflint --recursive --minimum-failure-severity=error

      - name: terraform validate (staging)
        working-directory: environments/staging
        run: terraform init -backend=false && terraform validate

      - name: terraform validate (dev)
        working-directory: environments/dev
        run: terraform init -backend=false && terraform validate

      - name: terraform validate (prod)
        working-directory: environments/prod
        run: terraform init -backend=false && terraform validate

      - name: terraform validate (shared)
        working-directory: environments/shared
        run: terraform init -backend=false && terraform validate
